name: Deploy
on:
  push:
    branches:
      - main

env:
  RUST_LOG: debug

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: zola@0.21.0
      - run: zola build

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
